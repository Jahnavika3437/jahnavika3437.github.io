<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vegas Vigilância e Segurança</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0b0f14;
      --surface: #12181f;
      --text: #f5f6f7;
      --muted: #9aa4af;
      --accent: #d4af37;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f5f6f7;
        --surface: #ffffff;
        --text: #14181d;
        --muted: #5b6570;
        --accent: #a8841f;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 24px;
    }
    .card {
      max-width: 480px;
      width: 100%;
      background: var(--surface);
      border-radius: 16px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
    }
    h1 {
      font-size: 1.5rem;
      margin: 0 0 8px;
      letter-spacing: 0.02em;
    }
    p {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin: 0;
    }
    .badge {
      display: inline-block;
      margin-top: 20px;
      padding: 6px 14px;
      border: 1px solid var(--accent);
      color: var(--accent);
      border-radius: 999px;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Vegas Vigilância e Segurança</h1>
    <p>Página em construção.</p>
    <span class="badge">Em breve</span>
  </div>
</body>
</html>
